[program:osonpos-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/osonpos/artisan queue:work redis --queue=default --sleep=3 --tries=3 --max-time=3600
directory=/var/www/osonpos
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/osonpos/storage/logs/worker.log
stopwaitsecs=3600
